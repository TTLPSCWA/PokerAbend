<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokerabend</title>
  <meta name="theme-color" content="#0B1513">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23e8b04a'/><circle cx='32' cy='32' r='18' fill='none' stroke='%23101a18' stroke-width='5' stroke-dasharray='7 6'/></svg>">
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Startseite: Spiel wählen, dann Lobby beitreten oder Spiel hosten -->
  <main id="lobby" class="lobby" hidden>
    <div class="lobby-felt">
      <h1 class="wordmark">Pokerabend</h1>
      <p class="lobby-sub">Spieleabend für eure Runde. Einer hostet, die anderen kommen per Link oder Code dazu.</p>

      <nav class="games-pick" aria-labelledby="games-title">
        <h2 id="games-title" class="pick-title">Spiele</h2>
        <div id="game-list" class="game-list" role="radiogroup" aria-labelledby="games-title"></div>
      </nav>

      <div class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="join" aria-selected="false">Lobby beitreten (Code)</button>
        <button role="tab" class="tab" data-tab="create" aria-selected="true">Spiel hosten</button>
      </div>

      <form id="lobby-form" class="lobby-form" autocomplete="off">
        <label class="field" id="f-name-field">
          <span>Dein Name</span>
          <input id="f-name" maxlength="16" required placeholder="z. B. Tobi">
        </label>
        <fieldset class="field" id="f-avatar-field">
          <legend>Avatar</legend>
          <div id="avatars" class="avatars"></div>
        </fieldset>

        <div data-for="join" hidden>
          <label class="field">
            <span>Code</span>
            <input id="f-code" maxlength="5" placeholder="ABCDE" class="code-input">
          </label>
          <p class="hint">Der Code bestimmt das Spiel – du landest direkt im richtigen Raum.</p>
        </div>

        <div data-for="create">
          <!-- Felder kommen vom gewählten Spiel (games/<id>/index.js → createFields) -->
          <div class="row3" id="create-fields"></div>
          <p class="hint" id="create-hint"></p>
        </div>

        <button class="btn btn-brass btn-big" type="submit" id="f-submit">Spiel hosten</button>
        <p id="lobby-error" class="error" role="alert"></p>
      </form>
    </div>
    <p class="lobby-foot" id="lobby-foot">Nur Spielgeld. Keine Anmeldung, kein Echtgeld.</p>
  </main>

  <!-- Hier zeichnet das gewählte Spiel seine Oberfläche hinein (z. B. /games/poker/poker.js) -->
  <div id="game-root" hidden></div>

  <!-- Eigene Bestätigungsdialoge statt confirm()/prompt() -->
  <dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <div id="dlg-extra"></div>
      <div class="dlg-actions">
        <button class="btn btn-ghost" value="cancel" id="dlg-cancel">Abbrechen</button>
        <button class="btn btn-brass" value="ok" id="dlg-ok">OK</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="offline" class="offline" hidden>Verbindung weg – verbinde neu …</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/core.js"></script>
  <!-- Gemeinsamer Rahmen der Rundenspiele (Mau-Mau, Würfel, Brett …) -->
  <script src="/games/kit.js"></script>
</body>
</html>
