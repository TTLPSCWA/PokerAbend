# Lokal testen:  docker compose up --build   →  http://localhost:3000
services:
  poker:
    build: .
    image: ${IMAGE:-pokerabend:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Lokal leer lassen = ohne Passwort. Auf dem Server Pflicht (siehe docker-compose.prod.yml)
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      # Discord-Login vorerst ausgeklammert
      # DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      # DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # DISCORD_ROLE_ID: ${DISCORD_ROLE_ID:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - poker-data:/app/data

volumes:
  poker-data:
