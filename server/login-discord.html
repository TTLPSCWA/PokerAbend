<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pokerabend – Anmelden</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23e8b04a'/><circle cx='32' cy='32' r='18' fill='none' stroke='%23101a18' stroke-width='5' stroke-dasharray='7 6'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="lobby">
    <div class="lobby-felt">
      <h1 class="wordmark">Pokerabend</h1>
      <p class="lobby-sub">Privater Tisch für unseren Discord-Server. Melde dich mit Discord an – rein kommt, wer bei uns auf dem Server ist.</p>
      <div class="lobby-form">
        <a class="btn btn-big discord-btn" href="{{HREF}}">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.7.1 18.2a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4-2 1 1.3 2a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.8-3.6-13.8ZM8 15.5c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.7 8 10.7s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
          Mit Discord anmelden
        </a>
        <p class="error" role="alert">{{ERROR}}</p>
        <p class="hint">Wir sehen nur deinen Namen, dein Profilbild und ob du auf unserem Server bist. Kein Passwort, keine Nachrichten.</p>
      </div>
    </div>
  </main>
</body>
</html>
