
services:
  poker:
    image: ghcr.io/ttlpscwa/pokerabend:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PUBLIC_URL: "https://tobiasthomasprojektap2.de"

    volumes:
      - poker-data:/app/data

    networks:
      - default
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=jule-finn-wedding_default"
      - "traefik.http.routers.poker.rule=Host(`tobiasthomasprojektap2.de`)"
      - "traefik.http.services.poker.loadbalancer.server.port=3000"

volumes:
  poker-data:

networks:
  traefik:
    external: true
    name: jule-finn-wedding_default
