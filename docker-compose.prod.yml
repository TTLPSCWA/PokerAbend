# Auf dem Server:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Caddy holt automatisch ein HTTPS-Zertifikat für DOMAIN (aus der .env).
services:
  poker:
    build: !reset null
    ports: !reset []
    expose:
      - "3000"
    environment:
      # Discord-Login vorerst ausgeklammert – solange gilt das Seitenpasswort (Pflicht)
      SITE_PASSWORD: ${SITE_PASSWORD:?Bitte SITE_PASSWORD in der .env setzen}
      # DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Bitte DISCORD_CLIENT_ID in der .env setzen}
      # DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Bitte DISCORD_CLIENT_SECRET in der .env setzen}
      # DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Bitte DISCORD_GUILD_ID in der .env setzen}
      # DISCORD_ROLE_ID: ${DISCORD_ROLE_ID:-}
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"   # echte IPs und HTTPS hinter Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Bitte DOMAIN in der .env setzen}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - poker

volumes:
  caddy-data:
  caddy-config:
